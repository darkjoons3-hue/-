name: Build EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        run: >
          cl /O2 /MT /EHsc main.cpp
          /link /SUBSYSTEM:WINDOWS user32.lib
          /OUT:SuccessApp.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SuccessApp-exe
          path: SuccessApp.exe
